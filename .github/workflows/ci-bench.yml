# TEMPORARY benchmark of LaTeX install methods. Deleted before merge.
# bench-rev: 1
name: CI bench

on:
  pull_request:
    paths:
      - ".github/workflows/ci-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  A:
    name: A apt trimmed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore apt package cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-bench-${{ runner.os }}-v1
      - name: Install LaTeX
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          sudo tee /etc/dpkg/dpkg.cfg.d/01-nodoc >/dev/null <<'CFG'
          path-exclude /usr/share/doc/*
          path-include /usr/share/doc/*/copyright
          path-exclude /usr/share/man/*
          path-exclude /usr/share/info/*
          path-exclude /usr/share/locale/*
          CFG
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          # Skip tex-common's "build every format" trigger; build the four we use below.
          for f in fmtutil fmtutil-sys; do
            sudo dpkg-divert --local --rename --add /usr/bin/$f
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/bin/$f >/dev/null
            sudo chmod +x /usr/bin/$f
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$RUNNER_TEMP/apt-archives" \
            -o APT::Sandbox::User=root \
            -o Dpkg::Options::=--force-unsafe-io \
            latexmk texlive-latex-extra texlive-plain-generic texlive-fonts-recommended texlive-science \
            texlive-xetex texlive-luatex texlive-extra-utils chktex latexdiff
          for f in fmtutil fmtutil-sys; do
            sudo rm -f /usr/bin/$f
            sudo dpkg-divert --remove --rename /usr/bin/$f
          done
          for f in pdflatex xelatex lualatex latex; do sudo fmtutil-sys --byfmt $f; done
          sudo chown -R "$USER" "$RUNNER_TEMP/apt-archives"
          rm -f "$RUNNER_TEMP/apt-archives/lock"
      - name: Check tools
        run: command -v latexmk chktex texcount latexdiff synctex xelatex lualatex || true
      - name: Prepare engine documents
        run: |
          for e in xelatex lualatex; do
            mkdir -p engines/$e
            printf '%% !TEX program = %s\n\\documentclass{article}\n\\usepackage{fontspec}\n\\begin{document}\nHello \\today\n\\end{document}\n' $e > engines/$e/main.tex
          done
      - name: Build test
        run: python3 scripts/build.py --force
      - name: Build sample-report
        run: python3 scripts/build.py --source bench --force sample-report
      - name: Build engines
        run: python3 scripts/build.py --source engines --force
      - name: Lint
        run: python3 scripts/ci_report.py lint
      - name: Summary
        run: python3 scripts/ci_report.py summary

  B:
    name: B install-texlive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LaTeX
        uses: zauguin/install-texlive@6671d0c62046c7e349fe154d5208fe746b07e037 # v4.4.0
        with:
          packages: >
            scheme-basic collection-latexrecommended collection-latexextra collection-fontsrecommended
            collection-mathscience collection-plaingeneric collection-binextra collection-xetex
            collection-luatex latexmk chktex texcount latexdiff
      - name: Add TeX Live to PATH
        run: echo "$(ls -d ~/texlive/*/bin/* | head -1)" >> "$GITHUB_PATH"
      - name: Check tools
        run: command -v latexmk chktex texcount latexdiff synctex xelatex lualatex || true
      - name: Prepare engine documents
        run: |
          for e in xelatex lualatex; do
            mkdir -p engines/$e
            printf '%% !TEX program = %s\n\\documentclass{article}\n\\usepackage{fontspec}\n\\begin{document}\nHello \\today\n\\end{document}\n' $e > engines/$e/main.tex
          done
      - name: Build test
        run: python3 scripts/build.py --force
      - name: Build sample-report
        run: python3 scripts/build.py --source bench --force sample-report
      - name: Build engines
        run: python3 scripts/build.py --source engines --force
      - name: Lint
        run: python3 scripts/ci_report.py lint
      - name: Summary
        run: python3 scripts/ci_report.py summary
