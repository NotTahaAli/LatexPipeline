name: Lint and tests

on:
  # Feature branches build through their pull request, so a push to them
  # doesn't run the same job twice with separate caches.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Rules and target version come from [tool.ruff] in pyproject.toml.
      - name: Ruff check
        run: uvx ruff@0.16.8 check scripts tests
      # The editor's co-editing decisions that protect data (leader takeover, deleted files).
      - name: Collab check
        run: node tests/collab_check.mjs scripts/serve_ui/collab.js

  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # tomli is needed below Python 3.11 (build.toml), and requirements.txt pins it.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests

  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check requirements.txt matches uv.lock
        run: |
          uv export --no-hashes --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt
